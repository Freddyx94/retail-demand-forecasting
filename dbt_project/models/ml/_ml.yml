version: 2

models:
  - name: stockout_days
    description: >
      Days inside improbably long zero-sales runs (likely out of stock).
      One row per item x date, flagged days only. Uses the full history, so
      it is for cleaning training labels and splitting the evaluation only,
      never a model feature.
    columns:
      - name: item_id
        description: "Item that was probably out of stock."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_id
      - name: date
        description: "Flagged day (units_sold = 0)."
        data_tests:
          - not_null
      - name: run_start
        description: "First day of the zero-sales run."
      - name: run_end
        description: "Last day of the zero-sales run."
      - name: run_days
        description: "Length of the run in days (>= 28)."

  - name: feat_daily_sales
    description: >
      Model input. One row per item x date with the target (units_sold) and
      the features known on the row's forecast origin: sales history up to
      the origin, plus calendar, events, price and product age for the day.
    columns:
      - name: date
        description: "Day being predicted."
        data_tests:
          - not_null
      - name: item_id
        description: "Item being predicted."
        data_tests:
          - not_null
      - name: units_sold
        description: "Target: units sold that day."
        data_tests:
          - not_null
      - name: origin_date
        description: "Day the forecast is made: the last day of known sales. Origins are every 28 days, counted back from the last sales day, and match the CV origins."
        data_tests:
          - not_null
      - name: horizon
        description: "Days ahead of the origin (1-28)."
      - name: mean_7d
        description: "Mean daily units over the 7 days ending on the origin. NULL in an item's first block after launch."
      - name: mean_28d
        description: "Mean daily units over the 28 days ending on the origin."
      - name: mean_56d
        description: "Mean daily units over the 56 days ending on the origin."
      - name: std_28d
        description: "Standard deviation of daily units over the 28 days ending on the origin."
      - name: days_since_sale
        description: "Days from the last sale to the origin. Long values hint at a stockout or delisting."
      - name: same_weekday_last
        description: "Units sold on the same weekday as the target day, in the last week up to the origin."
      - name: same_weekday_mean_4w
        description: "Mean units on that weekday over the 4 weeks up to the origin."
      - name: days_to_next_event
        description: "Days until the next event (0 = event today). Events are known in advance."
      - name: next_event_name
        description: "Name of that next event."
      - name: price_vs_ref
        description: "Price divided by the item's average price over the previous 364 days (past only). Below 1 = cheaper than usual."
      - name: price_change_wow
        description: "Price divided by the price 7 days earlier."
      - name: days_since_launch
        description: "Days since the item's launch_date."
      - name: is_likely_stockout
        description: "NOT A FEATURE. TRUE if the day is in ml.stockout_days. Used only to drop training labels and to split the evaluation."
        data_tests:
          - not_null
